# =============================================================================
# BEHAV3D Environment - Cross-Platform (Windows, macOS, Linux)
# =============================================================================
#
# This is the BASE environment. PyTorch/Cellpose with CUDA support should be
# installed separately using the install script (install_behav3d.py)
#
# Manual installation:
#   conda env create -f environment.yml
#   conda activate behav3d
#   # Then run: python install_behav3d.py --pytorch-only
#
# -----------------------------------------------------------------------------
# GUI stack: PyQt6 + napari 0.9
# -----------------------------------------------------------------------------
# napari and its Qt binding come from pip so they are resolved together from one index.
# Pins (napari 0.9.2 requirements):
#   napari[pyqt6]>=0.9.2,<0.10
#   PyQt6>6.5 + PyQt6-Qt6, excluding 6.11.0/6.11.1 (napari 0.9 excludes those two releases)
#   vispy>=0.17,<0.18, napari-console>=0.1.4, pyopengl>=3.1.10, magicgui>=0.10, superqt>=0.7.8
#   zarr>=3.0.8     (code uses zarr.storage.LocalStore, zarr 3 only)
#   numpy>=2.0,<2.1 (cellpose==3.1.1.2 pins numpy<2.1; pinned in conda so pip never has to
#                    replace a conda-owned numpy)
# cellpose[gui] (installed later by install_behav3d.py) brings pyqtgraph + PyQt6.
#
# WINDOWS ONLY - ICU DLL clash:
#   conda-forge's `icu` ships unversioned icuuc.dll/icuin.dll next to the versioned ones, and
#   conda's Python puts Library/bin ahead of System32 on the DLL search path. PyQt6 wheels
#   import the bare name `icuuc.dll` expecting Windows' built-in ICU, get conda's (different
#   exports) and fail with "ImportError: DLL load failed while importing QtCore". The
#   installer (fix_icu_for_pyqt6_windows) moves the unversioned copies to
#   Library/bin/_icu_unversioned_disabled; nothing else in the env imports them.
#
# Known `pip check` notices (metadata only; verified importable / working under numpy 2.0.2):
#   czifile 2026.x declares numpy>=2.1, pyclesperanto-prototype 0.24.x declares numpy<2.
#   numpy cannot move: cellpose==3.1.1.2 requires numpy<2.1. Revisit when cellpose moves.
#
# Testing note: napari 0.9 queries OpenGL when it builds its canvas, so a headless run needs a
# real Qt platform (QT_QPA_PLATFORM=windows on Windows, an X server such as Xvfb on Linux),
# not "offscreen".
# =============================================================================

name: behav3d
channels:
  - conda-forge
  - defaults

dependencies:
  # -------------------------------------------------------------------------
  # Python  (napari 0.9 requires >=3.11)
  # -------------------------------------------------------------------------
  - python=3.12

  # -------------------------------------------------------------------------
  # Core Scientific Computing
  # -------------------------------------------------------------------------
  - numpy>=2.0,<2.1          # cellpose==3.1.1.2 requires numpy<2.1
  - pandas>=2.0
  - scipy>=1.14
  - dask-core>=2024.0
  - threadpoolctl

  # -------------------------------------------------------------------------
  # Visualization
  # -------------------------------------------------------------------------
  - matplotlib-base>=3.9   # use -base to avoid pulling pyside6/qt6 (the meta `matplotlib` does)
  - seaborn>=0.13
  - plotly>=5.0

  # -------------------------------------------------------------------------
  # Image Processing & File I/O
  # -------------------------------------------------------------------------
  - scikit-image>=0.24,<0.26   # 0.26.0 conda-forge build has ClobberError bugs
  - tifffile>=2024.0
  - imageio>=2.30
  - pillow>=10.0
  - aicspylibczi>=3.1
  - czifile>=2019.7  # reads the CZI "TimeStamps" attachment; aicspylibczi has no attachment API
  - zarr>=3.0.8      # code needs zarr 3 (zarr.storage.LocalStore); napari 0.9 optional floor
  - h5py>=3.10
  - readlif>=0.6.6

  # -------------------------------------------------------------------------
  # Tracking
  # -------------------------------------------------------------------------
  - laptrack>=0.17
  - trackpy>=0.6

  # -------------------------------------------------------------------------
  # Machine Learning & Clustering
  # -------------------------------------------------------------------------
  - scikit-learn>=1.5
  - umap-learn>=0.5
  - hmmlearn>=0.3
  - dtaidistance>=2.3
  - pyopencl>=2024.1,<2026.1    # 2026.1.1 conda-forge build has SafetyError on win-64
  - pocl                        # Portable Computing Language for CPU OpenCL support

  # -------------------------------------------------------------------------
  # Graph Analysis & Single-Cell
  # -------------------------------------------------------------------------
  - igraph>=0.11
  - leidenalg>=0.10
  - scanpy>=1.10

  # -------------------------------------------------------------------------
  # Jupyter / IPython
  # -------------------------------------------------------------------------
  - ipywidgets>=8.1
  - ipyfilechooser>=0.6
  - traitlets>=5.14
  - ipython>=8.0
  - ipykernel>=6.0
  - jupyter >=1.0
  - jupyterlab>=3.0
  - jupyter_client>=8.0
  - jupyterlab_widgets>=3.0

  # -------------------------------------------------------------------------
  # Utilities
  # -------------------------------------------------------------------------
  - tqdm>=4.60
  - pyyaml>=6.0
  - joblib>=1.3
  - psutil>=5.9
  - networkx>=3.0
  - numba>=0.58
  - numcodecs>=0.12

  # -------------------------------------------------------------------------
  # Build Tools
  # -------------------------------------------------------------------------
  - pip>=24.0
  - setuptools>=70.0
  - wheel>=0.40

  # -------------------------------------------------------------------------
  # Pip packages
  # -------------------------------------------------------------------------
  - pip:
    # --- GUI stack: napari 0.9 + PyQt6 resolved together --------------------
    - "napari[pyqt6]>=0.9.2,<0.10"
    - "PyQt6>6.5,!=6.11.0,!=6.11.1"
    - "PyQt6-Qt6!=6.11.0,!=6.11.1"
    - "qtpy>=2.4"
    - "magicgui>=0.10"
    - "superqt>=0.7.8"
    - "napari-console>=0.1.4"
    - "napari-svg>=0.2"
    - "vispy>=0.17,<0.18"
    - "pyopengl>=3.1.10"
    # --- other pip-only packages ---------------------------------------------
    - btrack>=0.6
    - kaleido>=1.2
    - pypdf>=6.7
    - pypdfium2>=4,<5  # In-napari PDF preview (Results panel)
    - imageio-ffmpeg>=0.5.1
    - torchsummary>=1.5.1
    - apoc>=0.12  # GPU-accelerated pixel classifier (optional, requires OpenCL)
    # PyTorch and Cellpose installed separately via install script
    # to handle CUDA detection properly
    # cellpose==3.1.1.2  # Installed by install_behav3d.py with proper GPU support
